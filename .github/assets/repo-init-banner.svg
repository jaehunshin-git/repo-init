<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">repo-init 배너</title>
  <desc id="desc">새 GitHub 저장소를 만들고 라벨을 정리한 뒤 로컬로 clone하는 repo-init 워크플로 배너</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.52" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#102A2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="0" x2="1080" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="0.45" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <path d="M88 286C214 186 311 305 458 178C604 52 705 168 846 104C982 42 1046 74 1118 24" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.32"/>
  <path d="M74 68H370" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
  <path d="M830 296H1128" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="64" y="56" width="520" height="248" rx="24" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect x="96" y="86" width="118" height="34" rx="17" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.36"/>
    <text x="155" y="108" text-anchor="middle" fill="#CFFAFE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="700">GitHub CLI</text>

    <text x="96" y="168" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">repo-init</text>
    <text x="98" y="211" fill="#B7F7D6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700">새 저장소를 만드는 가장 짧은 루틴</text>
    <text x="98" y="247" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">빈 저장소 생성 · 라벨 세트 복제 · 로컬 clone까지 한 번에</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="70" width="426" height="70" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <circle cx="696" cy="105" r="18" fill="#60A5FA" fill-opacity="0.16" stroke="#93C5FD" stroke-opacity="0.42"/>
    <path d="M687 105H705M696 96V114" stroke="#DBEAFE" stroke-width="2.4" stroke-linecap="round"/>
    <text x="730" y="99" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750">저장소 생성</text>
    <text x="730" y="122" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">템플릿 파일 없이 빈 원격 저장소 생성</text>

    <rect x="650" y="158" width="426" height="70" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <circle cx="696" cy="193" r="18" fill="#A78BFA" fill-opacity="0.15" stroke="#C4B5FD" stroke-opacity="0.42"/>
    <path d="M687 188H705M687 198H699" stroke="#F5F3FF" stroke-width="2.4" stroke-linecap="round"/>
    <text x="730" y="187" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750">라벨 정리</text>
    <text x="730" y="210" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">기본 라벨 삭제 후 공통 라벨 세트 복제</text>

    <rect x="650" y="246" width="426" height="70" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.11"/>
    <circle cx="696" cy="281" r="18" fill="#34D399" fill-opacity="0.14" stroke="#86EFAC" stroke-opacity="0.42"/>
    <path d="M688 281H704M698 275L704 281L698 287" stroke="#DCFCE7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="730" y="275" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750">로컬 clone</text>
    <text x="730" y="298" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">현재 디렉터리에 바로 작업 폴더 준비</text>
  </g>

  <rect x="94" y="268" width="338" height="38" rx="19" fill="#020617" fill-opacity="0.62" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <text x="118" y="292" fill="#E0F2FE" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15">$ gh newrepo my-app --private</text>
</svg>
