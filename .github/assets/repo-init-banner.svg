<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <title id="title">repo-init 배너</title>
  <desc id="desc">새 GitHub 저장소를 만들고 라벨을 복제한 뒤 로컬로 clone하는 repo-init 워크플로 배너</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#08111F"/>
      <stop offset="1" stop-color="#0B2A2A"/>
    </linearGradient>
    <linearGradient id="line" x1="100" y1="38" x2="1100" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.48" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="30" fill="url(#bg)"/>
  <path d="M76 235C205 128 338 247 476 132C626 8 736 129 884 78C1004 36 1084 48 1138 30" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity="0.34"/>
  <path d="M72 66H416" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <path d="M780 244H1126" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <rect x="70" y="62" width="166" height="42" rx="21" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.46"/>
  <text x="153" y="90" text-anchor="middle" fill="#D1FAE5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">GitHub CLI</text>

  <text x="70" y="168" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="86" font-weight="800">repo-init</text>
  <text x="74" y="213" fill="#C7F9DD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700">새 저장소 초기화 루틴</text>

  <rect x="72" y="232" width="526" height="46" rx="23" fill="#020617" fill-opacity="0.74" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="98" y="262" fill="#E0F2FE" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="23" font-weight="600">$ gh newrepo my-app --private</text>

  <g>
    <rect x="700" y="66" width="374" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="730" y="99" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="800">01</text>
    <text x="790" y="99" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">빈 저장소 생성</text>

    <rect x="700" y="130" width="374" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="730" y="163" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="800">02</text>
    <text x="790" y="163" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">라벨 세트 복제</text>

    <rect x="700" y="194" width="374" height="50" rx="25" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="730" y="227" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="800">03</text>
    <text x="790" y="227" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700">로컬 clone 완료</text>
